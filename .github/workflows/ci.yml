name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Validate semantic models
        run: python -m insightpilot.semantic.validate

      - name: Run local evaluation quality gates
        run: python -m insightpilot.evaluation.cli --suite all

      - name: Run Chinese UI smoke tests
        run: |
          python -m pytest tests/test_chinese_labels.py tests/test_streamlit_demo_mode.py

      - name: Verify stable JSON schemas
        run: python -m pytest tests/test_json_schema_stability.py
