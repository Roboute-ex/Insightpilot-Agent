name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[app,test]" build
      - name: Test including UI interaction and ignore rules
        run: python -m pytest
      - name: Validate semantic models
        run: python -m insightpilot.semantic.validate
      - name: Core safety determinism
        run: python -m insightpilot.evaluation.cli --suite all
      - name: Build distributions
        run: python -m build
      - name: Verify wheel and YAML without source imports
        run: python scripts/check_distribution.py --dependency-mode project
