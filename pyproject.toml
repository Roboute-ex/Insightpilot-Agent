[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot-agent"
version = "0.6.0"
description = "Synthetic-data-first semantic analytics workbench with multi-table planning, evaluation, and observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "duckdb>=0.10",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "plotly>=5.18",
  "openpyxl>=3.1",
  "SQLAlchemy>=2.0",
  "PyYAML>=6.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
test = ["pytest>=8.0"]
langgraph = ["langgraph>=0.2"]
observability = ["opentelemetry-api>=1.20"]

[tool.setuptools.packages.find]
include = ["insightpilot*"]

[tool.setuptools.package-data]
"insightpilot.semantic" = ["models/*.yaml", "models/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
