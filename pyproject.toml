[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot-agent"
version = "0.3.0"
description = "Synthetic-data-only analytics automation workbench with CSV, Excel, and read-only database ingestion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "duckdb>=0.10",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "plotly>=5.18",
  "openpyxl>=3.1",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
test = ["pytest>=8.0"]
langgraph = ["langgraph>=0.2"]

[tool.setuptools.packages.find]
include = ["insightpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
